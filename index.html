<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream & Session Journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --bg:#0b0b16; --panel:#15152a; --border:#2a2a48; --border-soft:#232340;
    --text:#EEEAF8; --muted:#8B87A8; --muted-soft:#5f5c82;
    --violet:#9C8FD9; --violet-dim:#4f4a74; --amber:#E8B368; --rose:#C97B84; --teal:#7FB8A4;
    --session:#7C9CC4; --reallife:#B9A66B; --literature:#C08552; --notes:#8FB08A; --red:#E4574C;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;}
  html{ height:100%; }
  body{
    margin:0; height:100vh; height:100dvh; overflow:hidden; color:var(--text); font-family:'Inter',sans-serif;
    background: radial-gradient(ellipse at 20% 0%, #14142b 0%, var(--bg) 55%);
    position:relative;
  }
  body.light-mode{
    --bg:#f5f3fa; --panel:#ffffff; --border:#e3e0ee; --border-soft:#ece9f5;
    --text:#211f2e; --muted:#6b6785; --muted-soft:#948fb0;
    background: radial-gradient(ellipse at 15% -10%, var(--light-grad-a, #EDE7F9) 0%, var(--light-grad-b, #F7F5FC) 45%, var(--bg) 80%);
  }
  body.light-mode #stars{ display:none; }
  #stars{position:fixed; inset:0; pointer-events:none; opacity:0.5; z-index:0;}
  a{cursor:pointer;}

  #shell{display:flex; height:100%; position:relative; z-index:1;}

  #sidebar{
    width:var(--sidebar-w); flex-shrink:0; border-right:1px solid var(--border);
    padding:24px 16px; height:100%; overflow-y:auto;
    background:rgba(11,11,22,0.4);
    display:flex; flex-direction:column;
  }
  body.light-mode #sidebar{ background:rgba(255,255,255,0.6); }
  #sidebarFooter{margin-top:auto; padding-top:16px;}
  #sidebarFooter p{font-size:11px; color:var(--muted-soft); line-height:1.45; padding:6px 10px 0; margin:2px 0 0;}
  #sidebar .brand{display:flex; align-items:center; gap:9px; margin-bottom:14px; padding:0 6px;}
  #sidebar .brand .moon{color:var(--amber); font-size:19px;}
  #sidebar .brand span{font-family:'Fraunces',serif; font-weight:500; font-size:16px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
    font-size:14px; color:var(--muted); margin-bottom:2px; background:none; width:100%; text-align:left; border:none; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .nav-item .ic{width:16px; text-align:center; font-size:14px;}
  .nav-item:hover{background:rgba(127,127,127,0.08); color:var(--text);}
  .nav-item.active{background:var(--panel); color:var(--text); border:1px solid var(--border);}
  .nav-item.active .ic.dream{color:var(--violet);}
  .nav-item.active .ic.session{color:var(--session);}
  .nav-item.active .ic.reallife{color:var(--reallife);}
  .nav-item.active .ic.literature{color:var(--literature);}
  .nav-item.active .ic.notes{color:var(--notes);}
  .nav-item.active .ic.char{color:var(--rose);}
  .nav-item.active .ic.loc{color:var(--teal);}
  .nav-item.active .ic.theme{color:var(--amber);}
  .nav-divider{height:1px; background:var(--border-soft); margin:14px 6px;}
  .sidebar-label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted-soft); margin:18px 8px 8px;}
  .sidebar-group-header{
    display:flex; align-items:center; gap:6px; width:100%; text-align:left; background:none; border:none;
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted-soft); cursor:pointer;
    padding:9px 10px; margin:6px 0 2px; border-radius:8px; font-family:'Inter',sans-serif;
  }
  .sidebar-group-header:hover{ background:rgba(127,127,127,0.08); color:var(--muted); }
  .sidebar-group-content{ display:flex; flex-direction:column; }
  .sidebar-group-content.collapsed{ display:none; }
  #sidebarResizer{
    position:absolute; top:0; right:0; width:6px; height:100%; cursor:col-resize; z-index:5;
  }
  #sidebarResizer:hover, #sidebarResizer.active{ background:rgba(127,127,127,0.15); }
  @media (max-width: 780px){ #sidebarResizer{ display:none; } }
  #monthJump{display:flex; flex-direction:column; gap:1px;}
  .month-group{margin-bottom:1px;}
  .month-link{
    display:flex; justify-content:space-between; padding:6px 10px; border-radius:8px; width:100%;
    font-size:13px; color:var(--muted); background:none; border:none; text-align:left; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .month-link:hover{background:rgba(127,127,127,0.08); color:var(--text);}
  .month-link .n{color:var(--muted-soft); font-family:'JetBrains Mono',monospace; font-size:11px;}
  .month-sublist{display:flex; flex-direction:column; gap:1px; padding-left:6px; margin:2px 0 6px;}
  .thread-row{ display:flex; align-items:stretch; }
  .thread-gutter{ width:14px; flex-shrink:0; position:relative; }
  .thread-gutter .seg-up{ position:absolute; left:6px; top:0; height:50%; width:1px; background:var(--muted); }
  .thread-gutter .seg-down{ position:absolute; left:6px; top:50%; height:50%; width:1px; background:var(--muted); }
  .thread-gutter .seg-h{ position:absolute; left:6px; top:calc(50% - 0.5px); width:8px; height:1px; background:var(--muted); }
  .entry-link{
    background:none; border:none; color:var(--muted-soft); font-size:11.5px; text-align:left; padding:4px 8px;
    border-radius:6px; cursor:pointer; font-family:'JetBrains Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:1; min-width:0;
  }
  .entry-link:hover{background:rgba(127,127,127,0.08); color:var(--text);}

  #menuBtn{display:none;}
  #backdrop{display:none;}

  #main{flex:1; min-width:0; height:100%; overflow-y:auto;}
  .wrap{max-width:680px; margin:0 auto; padding:36px 24px 60px;}
  .mobile-topbar{display:none;}

  h1{font-family:'Fraunces',serif; font-weight:500; font-size:1.9rem; letter-spacing:-0.01em; margin:0 0 4px;}
  .subtitle{font-size:14px; color:var(--muted); margin:0 0 24px;}
  .amber-mono{color:var(--amber); font-family:'JetBrains Mono',monospace;}
  .rose-mono{color:var(--rose); font-family:'JetBrains Mono',monospace;}
  .teal-mono{color:var(--teal); font-family:'JetBrains Mono',monospace;}
  .violet-mono{color:var(--violet); font-family:'JetBrains Mono',monospace;}
  .session-mono{color:var(--session); font-family:'JetBrains Mono',monospace;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:24px;}

  .type-toggle{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .type-btn{
    flex:1; min-width:90px; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; border-radius:10px;
    font-size:12.5px; font-family:'Inter',sans-serif; border:1px solid var(--border-soft); background:transparent; color:var(--muted); cursor:pointer;
  }
  .type-btn.active.dream{border-color:var(--violet); color:var(--violet); background:rgba(156,143,217,0.08);}
  .type-btn.active.session{border-color:var(--session); color:var(--session); background:rgba(124,156,196,0.08);}
  .type-btn.active.reallife{border-color:var(--reallife); color:var(--reallife); background:rgba(185,166,107,0.10);}
  .type-btn.active.literature{border-color:var(--literature); color:var(--literature); background:rgba(192,133,82,0.10);}
  .type-btn.active.notes{border-color:var(--notes); color:var(--notes); background:rgba(143,176,138,0.10);}
  .type-btn.sortbtn{flex:none; min-width:0; padding:6px 12px;}
  .type-btn.sortbtn.active{border-color:var(--amber); color:var(--amber); background:rgba(232,179,104,0.10);}

  textarea{
    width:100%; background:transparent; border:none; outline:none; resize:none;
    color:var(--text); font-family:'Inter',sans-serif; font-size:15px; line-height:1.6;
  }
  textarea::placeholder{color:var(--muted-soft); opacity:0.6;}
  .hint{font-size:12px; color:var(--muted-soft); margin-top:2px;}
  #preview{font-size:13px; line-height:1.6; margin:6px 0 6px; opacity:0.9; min-height:0;}
  .form-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:8px;}
  input[type=date]{
    background:transparent; color:var(--muted); border:1px solid var(--border-soft);
    border-radius:10px; padding:6px 10px; font-size:16px; color-scheme:dark; font-family:'Inter',sans-serif;
  }
  body.light-mode input[type=date]{ color-scheme:light; }
  button{font-family:'Inter',sans-serif;}
  #saveBtn{
    display:flex; align-items:center; gap:6px; padding:9px 18px; border-radius:999px; border:none;
    font-size:14px; font-weight:500; background:var(--muted-soft); color:#0b0b16; opacity:0.5; cursor:pointer;
  }
  #saveBtn.active{background:var(--amber); opacity:1;}

  #filterBanner, #noteCatFilterBanner{
    display:flex; align-items:center; justify-content:space-between; padding:10px 16px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px; margin-bottom:18px; font-size:14px;
    flex-wrap:wrap; gap:8px;
  }
  #filterBanner button, #noteCatFilterBanner button{background:none; border:none; color:var(--muted); font-size:12px; display:flex; align-items:center; gap:4px; cursor:pointer;}

  .month-header{
    position:sticky; top:0; z-index:2; background:rgba(11,11,22,0.85); backdrop-filter:blur(6px);
    padding:10px 2px; font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:var(--muted);
    border-bottom:1px solid var(--border-soft); margin-bottom:14px;
  }
  body.light-mode .month-header{ background:rgba(245,243,250,0.9); }
  .mini-toggle{ display:inline-flex; border:1px solid var(--border-soft); border-radius:999px; overflow:hidden; }
  .mini-toggle-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:12.5px;
    padding:6px 12px; font-family:'Inter',sans-serif; white-space:nowrap;
  }
  .mini-toggle-btn.active{ background:var(--violet); color:#0b0b16; }
  /* Filter & View: a fixed floating button, always in the same viewport
     corner regardless of scroll, opening an overlay modal — no dependency
     on measuring or tracking scroll/layout position at all. */
  .filter-fab{
    position:fixed; bottom:24px; right:24px; z-index:50;
    background:var(--text); color:var(--bg); border:none; border-radius:999px;
    padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 4px 20px rgba(0,0,0,0.3); display:flex; align-items:center; gap:6px;
    font-family:'Inter',sans-serif;
  }
  .filter-fab.has-active{ background:var(--amber); color:#0b0b16; }
  .filter-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:640px){ .filter-modal-backdrop{ align-items:center; padding:20px; } }
  .filter-modal-panel{
    background:var(--panel); border:1px solid var(--border); border-radius:16px 16px 0 0;
    max-width:480px; width:100%; max-height:82vh; overflow-y:auto; padding:20px;
  }
  @media (min-width:640px){ .filter-modal-panel{ border-radius:16px; } }
  .filter-modal-header{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
    font-family:'Fraunces',serif; font-size:18px; font-weight:500;
  }
  .entry{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .entry-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .entry-title{font-size:13px; font-family:'JetBrains Mono',monospace; display:flex; align-items:center; gap:6px;}
  .entry-text{font-size:15px; line-height:1.65; margin:8px 0 0; white-space:pre-wrap;}
  .entry-actions{display:flex; gap:12px; align-items:center; flex-shrink:0;}
  .del-btn{
    background:none; border:none; color:var(--muted-soft); font-size:17px; cursor:pointer;
    padding:5px; margin:-3px; border-radius:8px; line-height:1; min-width:30px; min-height:30px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .del-btn:hover{color:var(--text);}
  .confirm{font-size:12px; display:flex; gap:8px; align-items:center;}
  .confirm a{color:var(--rose); text-decoration:underline;}
  .confirm .no{color:var(--muted);}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .tag-chip{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:2px 9px; border-radius:999px;
    background:transparent; border:1px solid var(--border-soft); color:var(--muted); cursor:pointer;
  }
  .tag-chip.char{color:var(--rose); border-color:var(--rose);}
  .tag-chip.loc{color:var(--teal); border-color:var(--teal);}
  .tag-chip.theme{color:var(--amber); border-color:var(--amber);}
  .tag-chip.selected{background:rgba(127,127,127,0.12);}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:34px 10px;}
  .empty small{display:block; color:var(--muted-soft); font-size:12px; margin-top:4px;}

  .cat-layout{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start;}
  .cat-pie{flex-shrink:0;}
  .cat-legend{flex:1; min-width:200px; display:flex; flex-direction:column; gap:6px;}
  .legend-row{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:10px; cursor:pointer; border:1px solid transparent;}
  .legend-row:hover{background:rgba(127,127,127,0.08);}
  .legend-row.selected{background:var(--panel); border-color:var(--border);}
  .legend-swatch{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .legend-name{font-family:'JetBrains Mono',monospace; font-size:13px; flex:1;}
  .legend-count{font-size:12px; color:var(--muted-soft); font-family:'JetBrains Mono',monospace;}

  .page-header{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .print-btn{
    background:none; border:1px solid var(--border-soft); color:var(--muted); font-size:12px; padding:7px 12px;
    border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; margin-top:4px;
  }
  .print-btn:hover{color:var(--text); border-color:var(--muted);}
  .save-edit-btn{background:var(--amber) !important; color:#0b0b16 !important; border:none !important;}
  .new-post-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--text); color:var(--bg);
    border:none; font-weight:600; font-size:14px; padding:10px 20px; border-radius:999px; cursor:pointer;
    margin-bottom:20px; font-family:'Inter',sans-serif; box-shadow:0 2px 14px rgba(0,0,0,0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .new-post-btn:hover{ transform:translateY(-1px) scale(1.02); box-shadow:0 4px 20px rgba(0,0,0,0.28); }
  .new-post-btn:active{ transform:translateY(0) scale(0.99); }

  .field-label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted-soft); margin:14px 0 5px;}
  .field-label:first-of-type{margin-top:0;}
  .sess-field{
    width:100%; background:rgba(127,127,127,0.05); border:1px solid var(--border-soft); border-radius:10px;
    padding:8px 10px; color:var(--text); font-family:'Inter',sans-serif; font-size:16px; line-height:1.55;
    resize:none; outline:none; overflow:hidden;
  }
  .sess-field::placeholder{color:var(--muted-soft); opacity:0.5;}
  .sess-field-text{
    width:100%; background:rgba(127,127,127,0.05); border:1px solid var(--border-soft); border-radius:10px;
    padding:8px 10px; color:var(--text); font-family:'Inter',sans-serif; font-size:16px; outline:none;
  }
  .sess-field-text::placeholder{color:var(--muted-soft); opacity:0.5;}
  .rating-stars{display:inline-flex; gap:3px; vertical-align:middle;}
  .star-slot{position:relative; display:inline-block; font-size:18px; line-height:1; width:18px;}
  .star-bg{color:var(--border-soft);}
  .star-fg{position:absolute; left:0; top:0; overflow:hidden; white-space:nowrap; color:var(--amber); pointer-events:none;}
  .rating-input .star-slot{cursor:pointer;}
  .rating-row{display:flex; align-items:center; gap:10px; margin-top:2px; flex-wrap:wrap;}
  .rating-clear{background:none; border:none; color:var(--muted-soft); font-size:11px; cursor:pointer; text-decoration:underline;}

  .sig-toggle{display:flex; gap:8px; margin-top:2px; flex-wrap:wrap;}
  .sig-btn{flex:1; min-width:100px; padding:8px; border-radius:10px; font-size:12px; border:1px solid var(--border-soft); background:transparent; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;}
  .sig-btn.active{border-color:var(--violet); color:var(--violet); background:rgba(156,143,217,0.08);}
  .sig-dot-btn{padding:8px 14px; border-radius:999px; border:1px solid var(--border-soft); background:transparent; color:var(--muted); cursor:pointer; font-size:13px; margin-top:2px;}
  .sig-dot-btn.active{border-color:var(--red); color:var(--red); background:rgba(228,87,76,0.10);}
  .done-toggle{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-top:8px; cursor:pointer;}
  .done-toggle input{width:15px; height:15px; accent-color:var(--notes);}

  .weather-toggle{display:flex; gap:6px; margin-top:2px; flex-wrap:wrap;}
  .weather-btn{padding:7px 10px; border-radius:10px; font-size:12px; border:1px solid var(--border-soft); background:transparent; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;}
  .weather-btn.active{border-color:var(--teal); color:var(--teal); background:rgba(127,184,164,0.10);}

  .mood-toggle{display:flex; gap:6px; margin-top:6px;}
  .mood-btn{padding:6px 14px; border-radius:999px; font-size:14px; border:1px solid var(--border-soft); background:transparent; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif; font-weight:600;}
  .mood-btn.active.neg{border-color:var(--red); color:var(--red); background:rgba(228,87,76,0.10);}
  .mood-btn.active.pos{border-color:var(--notes); color:var(--notes); background:rgba(143,176,138,0.10);}
  .mood-btn.active:not(.neg):not(.pos){border-color:var(--muted); color:var(--text);}

  .ai-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}

  .timeline-panel .field-label{margin:0 0 6px;}

  .excerpt-card{cursor:pointer;}
  .excerpt-card:hover{border-color:var(--muted-soft);}
  .excerpt-hint{font-size:11px; color:var(--muted-soft); white-space:nowrap;}

  .book-header{width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; color:var(--text); cursor:pointer; padding:4px 2px; text-align:left; font-size:14px;}
  .cluster-badge{
    display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--violet); background:rgba(156,143,217,0.08); border:1px solid var(--violet); border-radius:999px;
    padding:3px 10px; cursor:pointer; margin-top:8px;
  }
  .cluster-badge:hover{ background:rgba(156,143,217,0.18); }

  @media print{
    #stars, #sidebar, #backdrop, .mobile-topbar, .composer-panel, .print-btn,
    .del-btn, .confirm, #filterBanner button, #reconnectBanner, .excerpt-hint, .ai-row, .timeline-panel,
    .filter-fab, .filter-modal-backdrop, .new-post-btn{ display:none !important; }
    body{ background:#fff !important; color:#111 !important; }
    #shell{ display:block !important; }
    .wrap{ max-width:100% !important; padding:0 !important; }
    .panel{ background:#fff !important; border:1px solid #ccc !important; }
    .entry{ background:#fff !important; border:1px solid #ddd !important; break-inside:avoid; }
    .month-header{ background:#fff !important; color:#333 !important; position:static !important; backdrop-filter:none !important; }
    .amber-mono,.rose-mono,.teal-mono,.violet-mono,.session-mono,.entry-title{ color:#333 !important; }
    .tag-chip{ border-color:#999 !important; color:#333 !important; }
    .star-fg{ color:#333 !important; }
    .star-bg{ color:#ccc !important; }
    .subtitle{ color:#555 !important; }
    #filterBanner{ border:1px solid #ccc !important; background:#fff !important; }
  }

  @media (max-width: 780px){
    #sidebar{
      position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%);
      transition:transform 0.25s ease; z-index:70; width:250px; background:#0e0e1c;
    }
    body.light-mode #sidebar{ background:#fdfcff; }
    #sidebar.open{transform:translateX(0);}
    #backdrop.open{display:block; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:65;}
    .mobile-topbar{display:flex; align-items:center; gap:12px; padding:16px 20px 0; overflow:hidden;}
    .mobile-topbar span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);}
    #menuBtn{
      display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px;

/* =========================================================================
   THEME
   ========================================================================= */
// A soft, slightly different pastel wash for light mode, rotating through
// the day (every 6 hours) so it doesn't feel static, without being jarring.
const LIGHT_GRADIENTS = [
  {a:'#EDE7F9', b:'#F7F5FC'}, // lavender mist
  {a:'#FBE7DA', b:'#FDF6F0'}, // peach dawn
  {a:'#E1F3EA', b:'#F5FBF8'}, // mint morning
  {a:'#E3EEFB', b:'#F6FAFE'}, // sky blue
  {a:'#F8E3E9', b:'#FDF6F8'}, // rose quartz
  {a:'#FBF3DD', b:'#FEFCF3'}  // butter cream
];
function applyLightGradient(){
  const blockMs = 6 * 60 * 60 * 1000; // rotate every 6 hours
  const idx = Math.floor(Date.now() / blockMs) % LIGHT_GRADIENTS.length;
  const g = LIGHT_GRADIENTS[idx];
  document.documentElement.style.setProperty('--light-grad-a', g.a);
  document.documentElement.style.setProperty('--light-grad-b', g.b);
}
setInterval(applyLightGradient, 15 * 60 * 1000); // check periodically for long-open tabs

function applyTheme(){
  let isLight;
  if(themeMode === 'light') isLight = true;
  else if(themeMode === 'dark') isLight = false;
  else isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyLightGradient();
  document.body.classList.toggle('light-mode', isLight);
  const btn = document.getElementById('themeToggleBtn');
  if(btn){
    btn.innerHTML = themeMode === 'auto'
      ? '🌓 Theme: Auto'
      : (themeMode === 'light' ? '☀ Theme: Light' : '🌙 Theme: Dark');
  }
}
document.getElementById('themeToggleBtn').addEventListener('click', () => {
  themeMode = themeMode === 'auto' ? 'light' : (themeMode === 'light' ? 'dark' : 'auto');
  try{ localStorage.setItem('dj_theme_pref', themeMode); }catch(e){}
  applyTheme();
});
if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if(themeMode==='auto') applyTheme(); });
  }catch(e){}
}
applyTheme();

/* =========================================================================
   INDEXEDDB FILE HANDLE PERSISTENCE
   ========================================================================= */
function openHandleDB(){
  return new Promise((res,rej) => {
    const req = indexedDB.open('djFileHandles', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSaveHandle(handle){
  const db = await openHandleDB();
  return new Promise((res,rej) => {
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle, 'dataFile');
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbLoadHandle(){
  const db = await openHandleDB();
  return new Promise((res,rej) => {
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get('dataFile');
    req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error);
  });
}
async function idbClearHandle(){
  const db = await openHandleDB();
  return new Promise((res,rej) => {
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').delete('dataFile');
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function writeToFileHandle(handle, data){
  try{
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    return true;
  }catch(e){ console.error('file write failed', e); return false; }
}

/* =========================================================================
   PERSISTENCE + MIGRATION
   ========================================================================= */
function loadFromBrowserStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ entries = JSON.parse(raw); return; }
    for(const oldKey of ["dream_journal_entries_v5","dream_journal_entries_v4","dream_journal_entries_v3"]){
      const old = localStorage.getItem(oldKey);
      if(old){ entries = JSON.parse(old); saveToBrowserStorage(); return; }
    }
    const v2 = localStorage.getItem("dream_journal_entries_v2");
    if(v2){
      const parsed = JSON.parse(v2).sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
      entries = parsed.map((d,i) => ({
        id: d.id, type: "dream", number: i+1, date: d.date, text: d.text,
        characters: d.characters||[], locations: d.locations||[], themes: d.themes||[]
      }));
      saveToBrowserStorage();
      return;
    }
    const v1 = localStorage.getItem("dream_journal_entries_v1");
    if(v1){
      const parsed = JSON.parse(v1).sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
      entries = parsed.map((d,i) => ({
        id: d.id, type:"dream", number:i+1, date: d.date, text: d.text,
        characters: [], locations: [], themes: d.tags||[]
      }));
      saveToBrowserStorage();
    }
  }catch(e){ entries = []; }
}
function saveToBrowserStorage(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){ console.error(e); }
}
function save(){
  if(storageMode === 'file' && fileHandle){
    writeToFileHandle(fileHandle, entries);
  } else {
    saveToBrowserStorage();
  }
}

async function init(){
  // Best-effort: ask the browser to treat this site's storage as persistent
  // rather than evictable. Matters most on iOS, where ITP can otherwise
  // clear localStorage/IndexedDB after 7 days of inactivity.
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(() => {});
    }
  }catch(e){}

  if(FS_SUPPORTED){
    try{
      const handle = await idbLoadHandle();
      if(handle){
        const perm = await handle.queryPermission({mode:'readwrite'});
        if(perm === 'granted'){
          const text = await (await handle.getFile()).text();
          entries = JSON.parse(text);
          fileHandle = handle;
          storageMode = 'file';
        } else {
          fileHandle = handle;
          needsReconnect = true;
          loadFromBrowserStorage();
        }
      } else {
        loadFromBrowserStorage();
      }
    }catch(e){
      loadFromBrowserStorage();
    }
  } else {
    loadFromBrowserStorage();
  }
  normalizeEntries();
  renumberAll();
  updateStorageStatus();
  renderContent();
}

function normalizeEntries(){
  let changed = false;
  entries.forEach(e => {
    if(e.type === 'session' && e.content === undefined){
      e.content = e.text || '';
      e.freeAssociation = e.freeAssociation || '';
      e.feelings = e.feelings || '';
      e.therapistWords = e.therapistWords || '';
      e.afterFeel = e.afterFeel || '';
      e.afterResearch = e.afterResearch || '';
      e.rating = e.rating || 0;
      delete e.text;
      changed = true;
    }
    if(e.type === 'dream'){
      if(e.selfAnalysis === undefined){ e.selfAnalysis = ''; e.therapistView = ''; changed = true; }
      if(e.significance === undefined){ e.significance = 0; changed = true; }
      if(e.moodText === undefined){ e.moodText = ''; e.moodValence = ''; changed = true; }
      if(e.weather === undefined){ e.weather = ''; changed = true; }
      if(e.parallels === undefined){ e.parallels = ''; changed = true; }
      if(e.acknowledgements === undefined){ e.acknowledgements = ''; changed = true; }
      if(e.groupId === undefined){ e.groupId = null; e.groupOrder = 0; changed = true; }
    }
    if(e.type === 'dreamgroup'){
      if(e.label === undefined){ e.label = ''; e.comment = ''; changed = true; }
    }
    if(e.type === 'reallife'){
      if(e.event === undefined){ e.event = e.text || ''; e.remarks = e.remarks || ''; changed = true; }
      if(e.significant === undefined){ e.significant = false; changed = true; }
      if(e.title === undefined){ e.title = ''; changed = true; }
    }
    if(e.type === 'literature'){
      if(e.bookTitle === undefined){
        e.bookTitle = e.source || '';
        e.author = e.author || '';
        e.year = e.year || '';
        e.section = e.section || '';
        e.concept = e.concept || '';
        e.links = e.links || '';
        delete e.source;
        changed = true;
      }
    }
    if(e.type === 'notes'){
      if(e.content === undefined){ e.content = ''; changed = true; }
      if(e.done === undefined){ e.done = false; changed = true; }
      if(e.subject === undefined){ e.subject = ''; changed = true; }
      if(e.category === undefined){ e.category = ''; changed = true; }
    }
    if(!e.characters) { e.characters = []; changed = true; }
    if(!e.locations) { e.locations = []; changed = true; }
    if(!e.themes) { e.themes = []; changed = true; }
  });
  if(changed) save();
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function extractByPrefix(text, symbol){
  const re = new RegExp(escapeRegex(symbol) + "(?:\\[([\\p{L}\\p{N}_]+)\\]|([\\p{L}\\p{N}_]+))", "gu");
  const found = [];
  let m;
  while((m = re.exec(text)) !== null){
    const word = m[1] !== undefined ? m[1] : m[2];
    found.push(word.toLocaleLowerCase('tr'));
  }
  return [...new Set(found)];
}
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// Tokenize BEFORE escaping so a ">" tag symbol (an HTML-special character)
// doesn't get corrupted by escapeHtml() running first.
// Read-mode only: the @/>/# symbol itself is not shown (color alone marks
// the tag) — the raw text (symbol included) is what's actually stored and
// is what shows while editing. Supports @[Core]suffix so a grammatical
// suffix glued directly onto a tag (e.g. Turkish case endings) displays as
// ordinary text right after the colored core, without being part of the tag.
function highlightHtml(text){
  if(!text) return '';
  const re = /(@|>|#)(?:\[([\p{L}\p{N}_]+)\]|([\p{L}\p{N}_]+))/gu;
  let result = '';
  let lastIndex = 0;
  let m;
  while((m = re.exec(text)) !== null){
    result += escapeHtml(text.slice(lastIndex, m.index));
    const sym = m[1];
    const core = m[2] !== undefined ? m[2] : m[3];
    const cls = sym === '@' ? 'rose-mono' : (sym === '>' ? 'teal-mono' : 'amber-mono');
    result += `<span class="${cls}">${escapeHtml(core)}</span>`;
    lastIndex = m.index + m[0].length;
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}
function formatTitleDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}-${m}-${y.slice(2)}`;
}
function pad2(n){ return String(n).padStart(2,'0'); }
function entryTitle(e){
  if(e.type === 'reallife'){
    return (e.title && e.title.trim())
      ? `${e.title.trim()}, ${formatTitleDate(e.date)}`
      : `Real Life ${pad2(e.number)}, ${formatTitleDate(e.date)}`;
  }
  if(e.type === 'notes'){
    return (e.subject && e.subject.trim())
      ? e.subject.trim()
      : `Analysis ${pad2(e.number)}`;
  }
  if(e.type === 'literature'){
    const t = (e.bookTitle && e.bookTitle.trim()) ? e.bookTitle.trim() : `Literature ${pad2(e.number)}`;
    const sub = (e.section && e.section.trim()) ? ` — ${e.section.trim()}` : '';
    return `${t}${sub}, ${formatTitleDate(e.date)}`;
  }
  if(e.type === 'dreamgroup'){
    return (e.label && e.label.trim())
      ? `${e.label.trim()}, ${formatTitleDate(e.date)}`
      : `Dream Cluster ${pad2(e.number)}, ${formatTitleDate(e.date)}`;
  }
  return `${TYPE_META[e.type].label} ${pad2(e.number)}, ${formatTitleDate(e.date)}`;
}
// All posts are renumbered by date (oldest = 1) within their own type,
// so numbering always reflects chronological order, not creation order.
function renumberAll(){
  Object.keys(TYPE_META).forEach(type => {
    entries.filter(e => e.type === type)
      .sort((a,b) => a.date.localeCompare(b.date) || String(a.id).localeCompare(String(b.id)))
      .forEach((e,i) => { e.number = i+1; });
  });
}

function starsHtml(rating, interactive, idAttrValue){
  const idAttr = interactive && idAttrValue ? `id="${idAttrValue}"` : '';

  for(let i=1;i<=5;i++){

    html += `<span class="star-slot" data-index="${i}"><span class="star-bg">★</span><span class="star-fg" style="width:${fill}%">★</span></span>`;

function buildAiPrompt(e){

async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

/* =========================================================================
   STATS
   ========================================================================= */
function computeStats(list){
  const characters = {}, locations = {}, themes = {};
  const charLast = {}, locLast = {}, themeLast = {};
  list.forEach(e => {
    (e.characters||[]).forEach(t => { characters[t] = (characters[t]||0)+1; if(!charLast[t] || e.date > charLast[t]) charLast[t] = e.date; });
    (e.locations||[]).forEach(t => { locations[t] = (locations[t]||0)+1; if(!locLast[t] || e.date > locLast[t]) locLast[t] = e.date; });
    (e.themes||[]).forEach(t => { themes[t] = (themes[t]||0)+1; if(!themeLast[t] || e.date > themeLast[t]) themeLast[t] = e.date; });
  });
  return {characters, locations, themes, charLast, locLast, themeLast};
}

(function initSidebarResize(){
  const resizer = document.getElementById('sidebarResizer');
  if(!resizer) return;
  const MIN_W = 180, MAX_W = 440;
  let dragging = false;
  function setWidth(px){
    const clamped = Math.max(MIN_W, Math.min(MAX_W, px));
    document.documentElement.style.setProperty('--sidebar-w', clamped + 'px');
  }
  try{
    const saved = parseInt(localStorage.getItem('dj_sidebar_w'));
    if(saved) setWidth(saved);
  }catch(e){}
  resizer.addEventListener('mousedown', (e) => {
    dragging = true;
    resizer.classList.add('active');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    setWidth(e.clientX);
  });
  document.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    resizer.classList.remove('active');
    document.body.style.userSelect = '';
    try{
      const cur = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w').trim();
      localStorage.setItem('dj_sidebar_w', parseInt(cur));
    }catch(e){}
  });
})();

   FILE-ON-DISK STORAGE
   ========================================================================= */
function isStandaloneApp(){
  try{
    return (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }catch(e){ return false; }
}
function updateStorageStatus(){
  const statusEl = document.getElementById('storageStatus');
  const newBtn = document.getElementById('connectNewBtn');
  const openBtn = document.getElementById('connectOpenBtn');
  const discBtn = document.getElementById('disconnectBtn');
  const banner = document.getElementById('reconnectBanner');

  if(!FS_SUPPORTED){
    const homeScreenTip = !isStandaloneApp()
      ? ` For sturdier offline storage on this device, use your browser's Share button → "Add to Home Screen," then always open the journal from that icon.`
      : ` You're running from the Home Screen — good, that keeps your data more durable.`;
    statusEl.innerHTML = `Your browser doesn't support saving directly to disk (this needs Chrome or Edge on desktop).${homeScreenTip} Either way, use Export backup below regularly — it saves a real file to your Files app, outside the browser entirely.`;
    newBtn.style.display = 'none'; openBtn.style.display = 'none'; discBtn.style.display = 'none';
    banner.style.display = 'none';
    return;
  }
  banner.style.display = needsReconnect ? 'flex' : 'none';
  if(storageMode === 'file' && fileHandle){
    statusEl.innerHTML = `📁 Saving to <strong>${fileHandle.name}</strong> — safe from browser cleanup.`;
    newBtn.style.display = 'none'; openBtn.style.display = 'none'; discBtn.style.display = 'flex';
  } else {
    statusEl.innerHTML = needsReconnect
      ? "Reconnect above to resume saving to your file."
      : "Currently using browser storage. Connect a file on disk so clearing history can't affect it.";
    newBtn.style.display = 'flex'; openBtn.style.display = 'flex'; discBtn.style.display = 'none';
  }
}
document.getElementById('connectNewBtn').addEventListener('click', async () => {
  if(!FS_SUPPORTED) return;
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'dream-journal-data.json',
      types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
    });
    const ok = await writeToFileHandle(handle, entries);
    if(ok){
      fileHandle = handle; storageMode = 'file'; needsReconnect = false;
      await idbSaveHandle(handle);
      updateStorageStatus(); renderContent();
    }
  }catch(e){ /* user cancelled */ }
});
document.getElementById('connectOpenBtn').addEventListener('click', async () => {
  if(!FS_SUPPORTED) return;
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'JSON', accept: {'application/json': ['.json']} }]
    });
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const text = await (await handle.getFile()).text();
    const parsed = JSON.parse(text);
    if(!Array.isArray(parsed)) throw new Error('not a valid journal file');
    entries = parsed;
    fileHandle = handle; storageMode = 'file'; needsReconnect = false;
    await idbSaveHandle(handle);
    normalizeEntries(); renumberAll(); save();
    updateStorageStatus(); renderContent();
  }catch(e){ console.error(e); }
});
document.getElementById('disconnectBtn').addEventListener('click', async () => {
  fileHandle = null; storageMode = 'browser'; needsReconnect = false;
  await idbClearHandle();
  saveToBrowserStorage();
  updateStorageStatus(); renderContent();
});
document.getElementById('reconnectBtn').addEventListener('click', async () => {
  if(!fileHandle) return;
  try{
    const perm = await fileHandle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){
      const text = await (await fileHandle.getFile()).text();
      entries = JSON.parse(text);
      normalizeEntries(); renumberAll();
      storageMode = 'file'; needsReconnect = false;
      updateStorageStatus(); renderContent();
    }
  }catch(e){ console.error(e); }
});

document.getElementById('importFile').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed)) throw new Error('not an array');
      const valid = parsed.every(e => e && typeof e.date === 'string' && typeof e.type === 'string');
      if(!valid) throw new Error('missing fields');
      pendingImport = parsed;
      pendingImportError = false;
    }catch(e){
      pendingImport = null;
      pendingImportError = true;
    }
    view = 'import-confirm';
    document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.remove('active'));
    renderContent();
  };
  reader.readAsText(file);
});

  let html = `<h1>Import backup</h1>`;
  if(pendingImportError || !pendingImport){
    html += `<div class="panel"><div class="empty">This file couldn't be read as a valid backup.<small>Make sure you're importing a .json file that was exported from this journal.</small></div></div>
      <button class="nav-item" id="cancelImport" style="border:1px solid var(--border-soft); max-width:160px;">← Back</button>`;
  } else {
    const n = pendingImport.length;
    const counts = {};
    pendingImport.forEach(e => counts[e.type] = (counts[e.type]||0)+1);
    const summary = Object.keys(TYPE_META).map(t => `${counts[t]||0} ${TYPE_META[t].label.toLowerCase()}${(counts[t]||0)===1?'':'s'}`).join(', ');
    const existingIds = new Set(entries.map(e=>e.id));
    const newCount = pendingImport.filter(e => !existingIds.has(e.id)).length;
    html += `<div class="panel">
      <p style="margin:0 0 16px; font-size:14px; line-height:1.6;">This file has <strong>${n}</strong> entr${n===1?'y':'ies'} (${summary}). You currently have <strong>${entries.length}</strong> saved on this device.</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="nav-item" id="doMerge" style="border:1px solid var(--border-soft);">Merge — add ${newCount} new entr${newCount===1?'y':'ies'} I don't already have (existing entries are never touched)</button>
        <button class="nav-item" id="doReplace" style="border:1px solid var(--border-soft);">Replace everything with this backup</button>
        <button class="nav-item" id="cancelImport" style="border:1px solid var(--border-soft);">Cancel</button>
      </div>
    </div>`;
  }
  document.getElementById('content').innerHTML = html;
  const cancel = document.getElementById('cancelImport');
  if(cancel) cancel.addEventListener('click', () => {
    pendingImport = null; pendingImportError = false; view = 'feed';
    setActiveNav('feed');
    renderContent();
  });
  const rep = document.getElementById('doReplace');
  if(rep) rep.addEventListener('click', () => {
    entries = pendingImport; normalizeEntries(); renumberAll(); save(); pendingImport = null; view = 'feed';
    setActiveNav('feed');
    renderContent();
  });
  const mer = document.getElementById('doMerge');
  if(mer) mer.addEventListener('click', () => {
    const existingIds = new Set(entries.map(e=>e.id));
    const additions = pendingImport.filter(e => !existingIds.has(e.id));
    entries = entries.concat(additions); normalizeEntries(); renumberAll(); save(); pendingImport = null; view = 'feed';
    setActiveNav('feed');
    renderContent();
  });
}

/* =========================================================================
   MONTH GROUPING
   ========================================================================= */
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleString('en-US', {month:'long', year:'numeric'});
}
function orderedList(list){
  return list.slice().sort((a,b) => {
    if(a.date !== b.date) return b.date.localeCompare(a.date);
    if(a.type !== b.type) return TYPE_ORDER[a.type] - TYPE_ORDER[b.type];
    return b.number - a.number;
  });
}
function groupByMonth(list){
  const groups = []; const map = {};
  list.forEach(e => {
    const key = monthKey(e.date);
    if(!map[key]){ map[key] = {key, label: monthLabel(key), items: []}; groups.push(map[key]); }
    map[key].items.push(e);
  });
  return groups;
}

/* =========================================================================
   CHART HELPERS (pies, lines, bars — used by category pages + statistics)
   ========================================================================= */
function paletteFor(baseHex, n){
  const colors = [];
  for(let i=0;i<n;i++){
    const c = d3.hsl(baseHex);
    const t = n <= 1 ? 0 : i/(n-1);
    c.l = Math.min(0.82, Math.max(0.32, 0.42 - 0.12 + t*0.4));
    c.h = (c.h + i*23) % 360;
    colors.push(c.toString());
  }
  return colors;
}
function renderInlinePie(countsObj, baseColor, opts){
  opts = opts || {};
  const items = Object.entries(countsObj).map(([name,count]) => ({name,count}));
  if(items.length === 0) return `<p class="empty">Not enough data yet.</p>`;
  const total = items.reduce((s,i)=>s+i.count,0);
  const colors = paletteFor(baseColor, items.length);
  const r=80, innerR=38;
  const arcs = d3.pie().value(d=>d.count).sort(null)(items);
  const arcGen = d3.arc().innerRadius(innerR).outerRadius(r);
  let svg = `<svg viewBox="0 0 180 180" width="180" height="180"><g transform="translate(90,90)">`;
  arcs.forEach((a,i) => {
    const clickAttrs = opts.clickable ? ` class="pie-slice-stat" data-statname="${escapeAttr(items[i].name)}" style="cursor:pointer;"` : '';
    svg += `<path d="${arcGen(a)}" fill="${colors[i]}"${clickAttrs}><title>${escapeHtml(items[i].name)} — ${items[i].count}</title></path>`;
  });
  svg += `</g></svg>`;
  let legend = `<div class="cat-legend">`;
  items.forEach((it,i) => {
    const pct = total ? Math.round(it.count/total*100) : 0;
    const rowAttrs = opts.clickable
      ? ` class="legend-row legend-row-stat" data-statname="${escapeAttr(it.name)}" style="cursor:pointer;"`
      : ` class="legend-row" style="cursor:default;"`;
    legend += `<div${rowAttrs}><span class="legend-swatch" style="background:${colors[i]}"></span><span class="legend-name">${escapeHtml(it.name)}</span><span class="legend-count">${it.count} · ${pct}%</span></div>`;
  });
  legend += `</div>`;
  return `<div class="cat-layout"><div class="cat-pie">${svg}</div>${legend}</div>`;
}
function renderLineChart(points, opts){
  opts = opts || {};
  if(points.length === 0) return `<p class="empty">Not enough data yet.</p>`;
  const w=620, h=180, padL=30, padR=16, padT=16, padB=26;
  const xs = points.map(p=>p.x);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const xScale = d3.scaleLinear().domain([xMin, xMax===xMin?xMin+1:xMax]).range([padL, w-padR]);
  const yMax = opts.yMax !== undefined ? opts.yMax : Math.max(...points.map(p=>p.y), 1);
  const yScale = d3.scaleLinear().domain([0, yMax||1]).range([h-padB, padT]);
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; max-width:100%;">`;
  svg += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--border-soft)"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--border-soft)"/>`;
  if(points.length > 1){
    const pathD = points.map((p,i) => (i===0?'M':'L') + xScale(p.x) + ',' + yScale(p.y)).join(' ');
    svg += `<path d="${pathD}" fill="none" stroke="${opts.color||'var(--violet)'}" stroke-width="2"/>`;
  }
  points.forEach(p => {
    const titleTag = p.tooltip ? `<title>${escapeHtml(p.tooltip)}</title>` : '';
    svg += `<circle class="chart-marker" data-goto="${p.id||''}" cx="${xScale(p.x)}" cy="${yScale(p.y)}" r="4" fill="${opts.color||'var(--violet)'}" style="cursor:${p.id?'pointer':'default'};">${titleTag}</circle>`;
  });
  if(opts.xLabel) svg += `<text x="${padL}" y="${h-6}" font-size="10" fill="var(--muted-soft)">${escapeHtml(opts.xLabel)}</text>`;
  svg += `</svg>`;
  return svg;
}
function renderBarChart(points, opts){
  opts = opts || {};
  if(points.length === 0) return `<p class="empty">Not enough data yet.</p>`;
  const w=620, h=180, padL=30, padR=16, padT=16, padB=26;
  const yMax = Math.max(...points.map(p=>p.y), 1);
  const xScale = d3.scaleBand().domain(points.map(p=>p.x)).range([padL, w-padR]).padding(0.3);
  const yScale = d3.scaleLinear().domain([0, yMax]).range([h-padB, padT]);
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; max-width:100%;">`;
  svg += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--border-soft)"/>`;
  points.forEach(p => {
    const bw = xScale.bandwidth();
    const x = xScale(p.x);
    const y = yScale(p.y);
    const titleTag = p.tooltip ? `<title>${escapeHtml(p.tooltip)}</title>` : '';
    svg += `<rect class="chart-marker" data-goto="${p.id||''}" x="${x}" y="${y}" width="${bw}" height="${(h-padB)-y}" fill="${opts.color||'var(--violet)'}" style="cursor:${p.id?'pointer':'default'};" opacity="0.85">${titleTag}</rect>`;
  });
  if(opts.xLabel) svg += `<text x="${padL}" y="${h-6}" font-size="10" fill="var(--muted-soft)">${escapeHtml(opts.xLabel)}</text>`;
  svg += `</svg>`;
  return svg;
}
// Time-scaled: dreams are placed at their real calendar date, so gaps
// between dreams show up as visual spacing rather than a plotted number.
// Bar height = how many dreams happened that day. Hover shows details.
function renderDreamDateHistogram(){
  const dreams = entries.filter(e => e.type==='dream');
  if(dreams.length === 0) return `<p class="empty">No dreams logged yet.</p>`;
  const byDate = {};
  dreams.forEach(d => { (byDate[d.date] = byDate[d.date] || []).push(d); });
  const dateKeys = Object.keys(byDate).sort();
  const dateObjs = dateKeys.map(k => new Date(k+'T00:00:00'));
  const minD = dateObjs[0], maxD = dateObjs[dateObjs.length-1];
  const w=620, h=200, padL=34, padR=16, padT=16, padB=30;
  const xScale = d3.scaleTime().domain([minD, maxD]).range([padL, w-padR]);
  const maxCount = Math.max(...dateKeys.map(k => byDate[k].length));
  const yScale = d3.scaleLinear().domain([0, maxCount]).range([h-padB, padT]);
  const barW = 6;
  let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; max-width:100%;">`;
  svg += `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--border-soft)"/>`;
  dateKeys.forEach(k => {
    const items = byDate[k];
    const x = xScale(new Date(k+'T00:00:00'));
    const y = yScale(items.length);
    const barH = Math.max(2, (h-padB) - y);
    const label = items.map(d => entryTitle(d)).join(' · ');
    svg += `<rect class="chart-marker" data-goto="${items[0].id}" x="${(x-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${barH.toFixed(1)}" rx="2" fill="var(--violet)" style="cursor:pointer;"><title>${escapeHtml(k)} — ${items.length} dream${items.length===1?'':'s'}: ${escapeHtml(label)}</title></rect>`;
  });
  svg += `</svg>`;
  return svg;
}
function wireChartMarkerClicks(){
  document.querySelectorAll('.chart-marker').forEach(el => {
    const id = el.getAttribute('data-goto');
    if(!id) return;
    el.addEventListener('click', () => {
      view='feed'; filter=null; scrollToEntryId = id;
      setActiveNav('feed');
      renderContent();
    });
  });
}

/* =========================================================================
   PIE SECTION (characters / locations / themes) — with sort controls
   ========================================================================= */
function renderPieSection(title, entriesObj, baseColor, categoryKey, promptEmptyText, lastMap, entriesConsideredCount){
  const rawKeys = Object.keys(entriesObj);

  let html = `<div class="page-header"><div><h1>${title}</h1><p class="subtitle">${rawKeys.length} distinct ${title.toLowerCase()} across ${entriesConsideredCount} entr${entriesConsideredCount===1?'y':'ies'}.</p></div>
    <button class="print-btn" id="printBtn" type="button">🖨 Print / Save as PDF</button></div>`;

  html += `<div class="panel" style="padding:10px 14px;">
    <div class="field-label" style="margin:0 0 8px;">Show from</div>
    <div class="tags" style="margin-top:0;">
      ${TYPE_TOGGLE_ORDER.map(t => {
        const on = catTypeFilter.has(t);
        return `<button class="tag-chip ${on?'selected':''}" data-cattype="${t}" style="border-color:${on?TYPE_META[t].color:'var(--border-soft)'}; color:${on?TYPE_META[t].color:'var(--muted-soft)'};">${TYPE_META[t].icon} ${TYPE_META[t].label}</button>`;
      }).join('')}
    </div>
  </div>`;

  if(rawKeys.length === 0){
    html += `<div class="panel"><div class="empty">${promptEmptyText}</div></div>`;
    document.getElementById('content').innerHTML = html;
    wireCatTypeFilterClicks();
    const pb0 = document.getElementById('printBtn'); if(pb0) pb0.addEventListener('click', () => window.print());
    return;
  }

  // Split into "real" items and 1-count items, then bucket the singles
  // together unless the person has chosen to see them individually.
  let items = rawKeys.map(name => ({name, count: entriesObj[name], last: lastMap[name]||''}));
  let bucket = null;
  if(!showSingles){
    const singles = items.filter(it => it.count === 1);
    if(singles.length > 0){
      items = items.filter(it => it.count > 1);
      bucket = {
        name: `1-count ${title.toLowerCase()}`,
        count: singles.length,
        last: singles.reduce((m,it) => it.last > m ? it.last : m, ''),
        isBucket: true
      };
    }
  }

  if(catSortMode === 'alphabetical') items.sort((a,b) => a.name.localeCompare(b.name, 'tr'));
  else if(catSortMode === 'recent') items.sort((a,b) => b.last.localeCompare(a.last));
  else items.sort((a,b) => b.count - a.count);
  if(bucket) items.push(bucket);

  html += `<div class="panel" style="padding:10px 14px;">
    <div class="type-toggle" style="margin-bottom:0;">
      <button class="type-btn sortbtn ${catSortMode==='popularity'?'active':''}" data-sort="popularity">By Popularity</button>
      <button class="type-btn sortbtn ${catSortMode==='alphabetical'?'active':''}" data-sort="alphabetical">Alphabetical</button>
      <button class="type-btn sortbtn ${catSortMode==='recent'?'active':''}" data-sort="recent">Last Entered</button>
    </div>
  </div>`;

  if(showSingles){
    html += `<div class="panel" style="padding:10px 14px;">
      <button class="print-btn" type="button" id="collapseSinglesBtn">↩ Group 1-count items together again</button>
    </div>`;
  }

  const total = items.reduce((s,i)=>s+i.count,0);
  const colors = paletteFor(baseColor, items.length);
  const bucketIdx = items.findIndex(it => it.isBucket);
  if(bucketIdx !== -1) colors[bucketIdx] = '#8B87A8';
  const r = 95, innerR = 46;
  const arcs = d3.pie().value(d=>d.count).sort(null)(items);
  const arcGen = d3.arc().innerRadius(innerR).outerRadius(r);

  let svg = `<svg viewBox="0 0 220 220" width="220" height="220"><g transform="translate(110,110)">`;
  arcs.forEach((a,i) => {
    const it = items[i];
    const sel = !it.isBucket && filter && filter.category===categoryKey && filter.value===it.name;
    const clickAttr = it.isBucket ? `data-bucket="1"` : `data-name="${escapeAttr(it.name)}"`;
    svg += `<path d="${arcGen(a)}" fill="${colors[i]}" opacity="${filter && !sel ? 0.35 : 1}" stroke="${sel?'#fff':'none'}" stroke-width="${sel?2:0}" class="pie-slice" ${clickAttr} style="cursor:pointer"/>`;
  });
  svg += `<text text-anchor="middle" dy="-2" fill="var(--text)" font-size="22" font-family="Fraunces, serif">${total}</text>
          <text text-anchor="middle" dy="16" fill="var(--muted)" font-size="11">mentions</text>`;
  svg += `</g></svg>`;

  let legend = `<div class="cat-legend">`;
  items.forEach((it,i) => {
    const sel = !it.isBucket && filter && filter.category===categoryKey && filter.value===it.name;
    const pct = total ? Math.round(it.count/total*100) : 0;
    const symbol = it.isBucket ? '' : (categoryKey==='themes' ? '#' : (categoryKey==='characters'?'@':LOC_SYMBOL));
    const clickAttr = it.isBucket ? `data-bucket="1"` : `data-name="${escapeAttr(it.name)}"`;
    legend += `<div class="legend-row ${sel?'selected':''}" ${clickAttr}>
      <span class="legend-swatch" style="background:${colors[i]}"></span>
      <span class="legend-name" style="${it.isBucket?'font-style:italic; color:var(--muted-soft);':''}">${symbol}${escapeHtml(it.name)}</span>
      <span class="legend-count">${it.count} · ${pct}%</span>
    </div>`;
  });
  legend += `</div>`;

  html += `<div class="panel"><div class="cat-layout"><div class="cat-pie">${svg}</div>${legend}</div></div>`;
  document.getElementById('content').innerHTML = html;

  const pb = document.getElementById('printBtn');
  if(pb) pb.addEventListener('click', () => window.print());

  wireCatTypeFilterClicks();
  const csb = document.getElementById('collapseSinglesBtn');
  if(csb) csb.addEventListener('click', () => { showSingles = false; renderContent(); });

  document.querySelectorAll('[data-sort]').forEach(el => {
    el.addEventListener('click', () => { catSortMode = el.getAttribute('data-sort'); renderContent(); });
  });
  document.querySelectorAll('.pie-slice, .legend-row').forEach(el => {
    el.addEventListener('click', () => {
      if(el.hasAttribute('data-bucket')){
        showSingles = true;
        renderContent();
        return;
      }
      const name = el.getAttribute('data-name');
      filter = (filter && filter.category===categoryKey && filter.value===name) ? null : {category:categoryKey, value:name};
      view = 'feed';
      setActiveNav('feed');
      renderContent();
    });
  });
}
function wireCatTypeFilterClicks(){
  document.querySelectorAll('[data-cattype]').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.getAttribute('data-cattype');
      if(catTypeFilter.has(t)) catTypeFilter.delete(t); else catTypeFilter.add(t);
      renderContent();
    });
  });
}

/* =========================================================================
   SEARCH
   ========================================================================= */
function buildPlainExcerpt(e, q){
  const qLower = q.toLocaleLowerCase('tr');
  const fields = FIELDS_BY_TYPE[e.type] || [];
  for(const f of fields){
    if(f.type === 'weather') continue;
    const text = e[f.key];
    if(!text || !String(text).toLocaleLowerCase('tr').includes(qLower)) continue;
    const sentences = String(text).split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
    let idx = sentences.findIndex(s => s.toLocaleLowerCase('tr').includes(qLower));
    if(idx === -1) idx = 0;
    const start = Math.max(0, idx-2), end = Math.min(sentences.length, idx+3);
    return { label: f.label, text: sentences.slice(start,end).join(' ') || text, truncatedStart: start>0, truncatedEnd: end<sentences.length };
  }
  return null;
}
function searchResultCardHtml(e, q){

function wireComposer(){
  document.querySelectorAll('.type-btn[data-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      composerType = btn.getAttribute('data-type');
      composerRating = 0; composerSignificance = 0; composerSignificant = false; composerWeather = ''; composerMoodValence = '';
      renderContent();
    });
  });
  document.getElementById('dreamDate').value = new Date().toISOString().slice(0,10);
  const saveBtn = document.getElementById('saveBtn');
  const preview = document.getElementById('preview');
  const fields = FIELDS_BY_TYPE[composerType];
  const meta = TYPE_META[composerType];
  const textFields = fields.filter(f => f.type !== 'weather');
  composerRating = 0; composerSignificance = 0; composerSignificant = false; composerWeather = ''; composerMoodValence = '';

  function fieldEl(key){ return document.getElementById('field_'+key); }

  function refresh(){
    const combined = textFields.map(f => fieldEl(f.key).value).join(' ');
    const chars = extractByPrefix(combined,'@'), locs = extractByPrefix(combined, LOC_SYMBOL), themes = extractByPrefix(combined,'#');
    if(chars.length || locs.length || themes.length){
      const parts = [
        ...chars.map(c => `<span class="rose-mono">@${escapeHtml(c)}</span>`),
        ...locs.map(l => `<span class="teal-mono">${LOC_SYMBOL}${escapeHtml(l)}</span>`),
        ...themes.map(t => `<span class="amber-mono">#${escapeHtml(t)}</span>`)
      ];
      preview.innerHTML = "Tagged: " + parts.join(" ");
    } else {
      preview.innerHTML = "";
    }
    const hasAny = textFields.some(f => fieldEl(f.key).value.trim()) || composerRating > 0 || composerSignificance > 0 || composerSignificant || composerWeather || composerMoodValence;
    saveBtn.classList.toggle('active', hasAny);
  }
  textFields.forEach(f => fieldEl(f.key).addEventListener('input', refresh));

  if(meta.hasRating){
    function updateStarsVisual(){
      document.querySelectorAll('#ratingPicker .star-slot').forEach(slot => {
        const idx = parseInt(slot.getAttribute('data-index'));
        let fill = 0;
        if(composerRating >= idx) fill = 100;
        else if(composerRating >= idx - 0.5) fill = 50;
        slot.querySelector('.star-fg').style.width = fill + '%';
      });
      document.getElementById('ratingLabel').textContent = composerRating > 0 ? (composerRating + ' / 5') : 'No rating';
    }
    document.querySelectorAll('#ratingPicker .star-slot').forEach(slot => {
      slot.addEventListener('click', (ev) => {
        const rect = slot.getBoundingClientRect();
        const half = (ev.clientX - rect.left) < rect.width/2;
        const idx = parseInt(slot.getAttribute('data-index'));
        composerRating = half ? idx - 0.5 : idx;
        updateStarsVisual(); refresh();
      });
    });
    const clearBtn = document.getElementById('ratingClear');
    clearBtn.addEventListener('click', () => { composerRating = 0; updateStarsVisual(); refresh(); });
  }
  if(meta.hasSignificanceLevels){
    document.querySelectorAll('#sigToggle .sig-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        composerSignificance = parseInt(btn.getAttribute('data-val'));
        document.querySelectorAll('#sigToggle .sig-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        refresh();
      });
    });
  }
  if(meta.hasSignificanceFlag){
    const dotBtn = document.getElementById('sigDotToggle');
    dotBtn.addEventListener('click', () => {
      composerSignificant = !composerSignificant;
      dotBtn.classList.toggle('active', composerSignificant);
      refresh();
    });
  }
  if(meta.hasDone){
    const dc = document.getElementById('doneCheck');
    dc.addEventListener('change', refresh);
  }
  if(composerType === 'dream'){
    document.querySelectorAll('#weatherToggle .weather-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-val');
        composerWeather = (composerWeather === val) ? '' : val;
        document.querySelectorAll('#weatherToggle .weather-btn').forEach(b => b.classList.remove('active'));
        if(composerWeather) btn.classList.add('active');
        refresh();
      });
    });
    document.querySelectorAll('#moodToggle .mood-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        composerMoodValence = btn.getAttribute('data-val');
        document.querySelectorAll('#moodToggle .mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        refresh();
      });
    });
    wireClusterPicker(false);
  }

  const cancelBtn = document.getElementById('cancelComposerBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', () => { composerExpanded = false; renderContent(); });

  saveBtn.addEventListener('click', () => {
    const vals = {};
    textFields.forEach(f => vals[f.key] = fieldEl(f.key).value.trim());
    const hasAny = Object.values(vals).some(v => v) || composerRating > 0 || composerSignificance > 0 || composerSignificant || composerWeather || composerMoodValence;
    if(!hasAny) return;
    const entryDate = document.getElementById('dreamDate').value || new Date().toISOString().slice(0,10);
    const entry = Object.assign({
      id: newId(),
      type: composerType,
      number: 0,
      date: entryDate,
    }, vals);
    if(meta.hasRating) entry.rating = composerRating;
    if(meta.hasSignificanceLevels) entry.significance = composerSignificance;
    if(meta.hasSignificanceFlag) entry.significant = composerSignificant;
    if(meta.hasDone) entry.done = document.getElementById('doneCheck').checked;
    if(composerType === 'dream'){
      entry.weather = composerWeather;
      entry.moodValence = composerMoodValence;
      const cluster = resolveClusterSelection(false, entryDate);
      entry.groupId = cluster.groupId;
      entry.groupOrder = cluster.groupOrder;
    }
    retagEntry(entry);
    entries.push(entry);
    renumberAll();
    save();
    composerRating = 0; composerSignificance = 0; composerSignificant = false; composerWeather = ''; composerMoodValence = '';
    composerExpanded = false;
    renderContent();
  });
}

function buildDreamNightItems(dreamList){
  const seen = new Set();
  const items = [];
  dreamList.forEach(d => {
    if(d.groupId){
      if(seen.has(d.groupId)) return;
      seen.add(d.groupId);
      const cluster = entries.find(en => en.id === d.groupId && en.type === 'dreamgroup');
      if(!cluster){ items.push({kind:'single', entry:d, date:d.date}); return; }
      const members = dreamsInCluster(d.groupId).filter(m => dreamList.includes(m));
      if(members.length === 0) return;
      items.push({kind:'cluster', cluster, members, date: cluster.date || members[0].date});
    } else {
      items.push({kind:'single', entry:d, date:d.date});
    }
  });
  return items;
}
function groupItemsByMonth(items){
  const groups = []; const map = {};
  items.forEach(it => {
    const key = monthKey(it.date);
    if(!map[key]){ map[key] = {key, label: monthLabel(key), items: []}; groups.push(map[key]); }
    map[key].items.push(it);
  });
  return groups;
}
function renderDreamNightCard(cluster, members){

  const isEditingCluster = editingEntryId === cluster.id;

function renderListView(kind){
  const cfg = {
    feed:     {title:"Feed",     sub:"Everything you've kept, together.",              typeFilter:null,     lockType:null},
    dreams:   {title:"Dreams",   sub:"Just your dreams.",                               typeFilter:"dream",   lockType:"dream"},
    sessions: {title:"Sessions", sub:"Just your therapy session notes.",                typeFilter:"session", lockType:"session"},
    reallife: {title:"Real Life",sub:"Real-world events and observations relevant to your dreams and sessions.", typeFilter:"reallife", lockType:"reallife"},
    notes:    {title:"Analysis", sub:"Reflections and analysis, revisited and refined over time.", typeFilter:"notes",   lockType:"notes"},
  }[kind];

  let html = `<div class="page-header"><div><h1>${cfg.title}</h1><p class="subtitle">${cfg.sub}</p></div>
    <button class="print-btn" id="printBtn" type="button">🖨 Print / Save as PDF</button></div>`;

  if(kind === 'dreams'){ html += dreamFilterFabHtml() + dreamFilterModalHtml(); }
  if(kind === 'notes'){ html += notesViewToggleHtml(); }

  if(filter){
    const symbol = filter.category==='themes'?'#':(filter.category==='characters'?'@':LOC_SYMBOL);
    const cls = filter.category==='themes'?'amber-mono':(filter.category==='characters'?'rose-mono':'teal-mono');
    html += `<div id="filterBanner"><span>Showing entries with <span class="${cls}">${symbol}${escapeHtml(filter.value)}</span></span>
      <button id="clearFilterBtn" type="button">✕ clear</button></div>`;
  }
  if(kind === 'notes' && noteCategoryFilter !== null){
    html += `<div id="noteCatFilterBanner"><span>Showing notes in category: <strong>${escapeHtml(noteCategoryFilter)}</strong></span>
      <button id="clearNoteCategoryBtn" type="button">✕ clear</button></div>`;
  }

  html += composerSectionHtml(cfg.lockType);

  // Real Life: the significant-events timeline display was removed here per
  // request; marking a post significant (the red dot) still fully works.

  let base = cfg.typeFilter ? entries.filter(e => e.type===cfg.typeFilter) : entries.filter(e => e.type !== 'dreamgroup' && e.type !== 'notes');
  if(filter) base = base.filter(e => (e[filter.category]||[]).includes(filter.value));
  if(kind === 'dreams'){
    if(dreamMoodFilter) base = base.filter(e => (e.moodValence || 'neutral') === dreamMoodFilter);
    if(dreamWeatherFilter) base = base.filter(e => dreamWeatherFilter === 'none' ? !e.weather : e.weather === dreamWeatherFilter);
    if(dreamSigFilter !== null) base = base.filter(e => (e.significance||0) === dreamSigFilter);
  }
  if(kind === 'notes' && noteCategoryFilter !== null){
    base = base.filter(e => ((e.category && e.category.trim()) || 'Uncategorized') === noteCategoryFilter);
  }
  const list = orderedList(base);

  const totalOfKind = cfg.typeFilter ? entries.filter(e=>e.type===cfg.typeFilter).length : entries.filter(e => e.type !== 'dreamgroup' && e.type !== 'notes').length;

  if(totalOfKind === 0){
    html += `<div class="empty">Nothing logged here yet. ${cfg.lockType ? 'The first ' + cfg.lockType + ' you save' : 'The first entry you save'} appears here.</div>`;
  } else if(list.length === 0){
    html += `<p style="text-align:center;color:var(--muted);font-size:14px;padding:20px 0;">No entries match this filter.</p>`;
  } else if(kind === 'dreams' && dreamViewMode === 'byNight' && !filter){
    const items = buildDreamNightItems(list);
    const groups = groupItemsByMonth(items);
    groups.forEach(g => {
      html += `<div class="month-header" id="month-${kind}-${g.key}">${g.label} <span style="color:var(--muted-soft);font-family:'JetBrains Mono',monospace;font-size:12px;">(${g.items.length})</span></div>`;
      g.items.forEach(it => {
        if(it.kind === 'cluster'){
          html += renderDreamNightCard(it.cluster, it.members);
        } else if(editingEntryId === it.entry.id){
          html += editFormHtml(it.entry);
        } else {
          html += entryCardHtml(it.entry);
        }
      });
    });
  } else {
    const groups = groupByMonth(list);
    groups.forEach(g => {
      html += `<div class="month-header" id="month-${kind}-${g.key}">${g.label} <span style="color:var(--muted-soft);font-family:'JetBrains Mono',monospace;font-size:12px;">(${g.items.length})</span></div>`;
      g.items.forEach(e => {
        if(filter){
          html += excerptCardHtml(e, filter);
        } else if(editingEntryId === e.id){
          html += editFormHtml(e);
        } else if(kind === 'notes'){
          html += noteCardHtml(e);
        } else {
          html += entryCardHtml(e);
        }
      });
    });
  }

  document.getElementById('content').innerHTML = html;
  const npb = document.getElementById('newPostBtn');
  if(npb) npb.addEventListener('click', () => { composerExpanded = true; renderContent(); });
  if(composerExpanded) wireComposer();
  if(kind === 'dreams'){
    wireDreamFilterModal();
    wireDreamFieldFilter(); wireDreamMetaFilter();
    document.querySelectorAll('[data-viewmode]').forEach(el => {
      el.addEventListener('click', () => { dreamViewMode = el.getAttribute('data-viewmode'); expandedCluster = null; renderContent(); });
    });
    document.querySelectorAll('[data-cluster]').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.getAttribute('data-cluster');
        expandedCluster = (expandedCluster === key) ? null : key;
        renderContent();
      });
    });
  }
  const cb = document.getElementById('clearFilterBtn');
  if(cb) cb.addEventListener('click', () => { filter = null; renderContent(); });
  const cncb = document.getElementById('clearNoteCategoryBtn');
  if(cncb) cncb.addEventListener('click', () => { noteCategoryFilter = null; renderContent(); });
  if(kind === 'notes'){
    document.querySelectorAll('[data-notesviewmode]').forEach(el => {
      el.addEventListener('click', () => { notesViewMode = el.getAttribute('data-notesviewmode'); renderContent(); });
    });
  }
  wireEntryCards();
  const pb = document.getElementById('printBtn');
  if(pb) pb.addEventListener('click', () => window.print());
  wireChartMarkerClicks();
  wireAutoGrowAll();

  if(scrollToEntryId){
    const id = scrollToEntryId;
    scrollToEntryId = null;
    requestAnimationFrame(() => {
      const el = document.getElementById('entry-'+id);
      if(el){
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.style.transition = 'box-shadow 0.3s ease';
        el.style.boxShadow = '0 0 0 2px var(--amber)';
        setTimeout(() => { el.style.boxShadow = ''; }, 1600);
      }
    });
  }
}

/* =========================================================================
   LITERATURE PAGE (grouped by book, expandable)
   ========================================================================= */
function renderLiteraturePage(){
  let html = `<div class="page-header"><div><h1>Literature</h1><p class="subtitle">Books, concepts, and ideas worth remembering.</p></div>
    <button class="print-btn" id="printBtn" type="button">🖨 Print / Save as PDF</button></div>`;
  html += composerSectionHtml('literature');

  const lit = entries.filter(e => e.type === 'literature');
  if(lit.length === 0){
    html += `<div class="empty">Nothing logged here yet. The first literature entry you save appears here.</div>`;
  } else {
    const groups = {};
    const order = [];
    lit.forEach(e => {
      const key = (e.bookTitle && e.bookTitle.trim()) ? e.bookTitle.trim().toLocaleLowerCase('tr') : ('__u_' + e.id);
      if(!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(e);
    });
    const maxDate = arr => arr.reduce((m,e) => e.date > m ? e.date : m, arr[0].date);
    order.sort((a,b) => maxDate(groups[b]).localeCompare(maxDate(groups[a])));

    order.forEach(key => {
      const items = groups[key].slice().sort((a,b) => b.date.localeCompare(a.date));
      const first = items[0];
      const displayTitle = (first.bookTitle && first.bookTitle.trim()) ? first.bookTitle.trim() : `Literature ${pad2(first.number)}`;
      const metaBits = [first.author, first.year].filter(v => v && v.trim());
      const isOpen = expandedBook === key;
      html += `<div class="panel">
        <button class="book-header" type="button" data-book="${escapeAttr(key)}">
          <span>${isOpen?'▾':'▸'} <strong style="font-family:'Fraunces',serif;">${escapeHtml(displayTitle)}</strong>${metaBits.length?` <span style="color:var(--muted-soft); font-size:12px;">(${escapeHtml(metaBits.join(', '))})</span>`:''}</span>
          <span style="color:var(--muted-soft); font-family:'JetBrains Mono',monospace; font-size:12px;">${items.length} section${items.length===1?'':'s'}</span>
        </button>
        ${isOpen ? items.map(e => (editingEntryId===e.id ? editFormHtml(e) : entryCardHtml(e))).join('') : ''}
      </div>`;
    });
  }

  document.getElementById('content').innerHTML = html;
  const npb = document.getElementById('newPostBtn');
  if(npb) npb.addEventListener('click', () => { composerExpanded = true; renderContent(); });
  if(composerExpanded) wireComposer();
  wireEntryCards();
  wireAutoGrowAll();
  const pb = document.getElementById('printBtn'); if(pb) pb.addEventListener('click', () => window.print());
  document.querySelectorAll('.book-header').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-book');
      expandedBook = (expandedBook===key) ? null : key;
      renderContent();
    });
  });
}

/* =========================================================================
   READ-MODE ENTRY CARD
   ========================================================================= */
function entryCardHtml(e, opts){
  opts = opts || {};
  const chips = [];
  (e.characters||[]).forEach(t => chips.push(chip(t,'char','characters')));
  (e.locations||[]).forEach(t => chips.push(chip(t,'loc','locations')));
  (e.themes||[]).forEach(t => chips.push(chip(t,'theme','themes')));

  const meta = TYPE_META[e.type];
  const doneToggle = meta.hasDone ? `<button class="del-btn" type="button" data-toggle-done="${e.id}" title="Toggle done">${e.done?'☑':'☐'}</button>` : '';
  const actions = confirmDeleteId === e.id
    ? `<span class="confirm"><span style="color:var(--rose)">Delete?</span><a data-yes="${e.id}">Yes</a><a class="no" data-no="1">No</a></span>`
    : `<span class="entry-actions">
        ${doneToggle}
        <button class="del-btn" type="button" data-edit="${e.id}" title="Edit">✎</button>
        <button class="del-btn" type="button" data-del="${e.id}" title="Delete">🗑</button>
      </span>`;

  const clusterBadge = opts.suppressClusterBadge ? '' : clusterBadgeHtml(e);

  let sections = '';
  (FIELDS_BY_TYPE[e.type]||[]).forEach(f => {
    if(e.type==='dream' && dreamFieldFilter && !dreamFieldFilter.has(f.key)) return;
    sections += fieldReadHtml(f, e);
  });
  if(meta.hasRating && e.rating){
    sections += `<div class="field-label">Session Rating</div>
      <div class="rating-row">${starsHtml(e.rating, false)}<span style="font-size:12px;color:var(--muted-soft);">${e.rating} / 5</span></div>`;
  }
  const body = sections || `<p class="entry-text" style="color:var(--muted-soft); font-style:italic;">Nothing recorded yet — click ✎ to add details, even weeks later.</p>`;

  const aiRow = (e.type === 'literature' && (e.bookTitle || e.concept || e.links)) ? `
    <div class="ai-row">
      <button class="print-btn" type="button" data-copy-prompt="${e.id}">📋 Copy AI prompt</button>
      <button class="print-btn" type="button" data-open-ai="${e.id}">✨ Open AI chat ↗</button>
    </div>` : '';

  const collapseAttr = opts.collapsibleNote ? ` data-collapse-note="${e.id}"` : '';
  const titleCursor = opts.collapsibleNote ? ' cursor:pointer;' : '';
  const startedDate = e.type === 'notes'
    ? `<div style="font-size:11px; color:var(--muted-soft); margin-top:2px; font-family:'JetBrains Mono',monospace;">Started ${formatTitleDate(e.date)}</div>`
    : '';

  return `<div class="entry" id="entry-${e.id}">
    <div class="entry-top">
      <span class="entry-title"${collapseAttr} style="color:${meta.color}; font-weight:${isBold(e)?'700':'400'};${titleCursor}">${meta.icon} ${escapeHtml(entryTitle(e))}${significanceBadge(e)}</span>
      ${actions}
    </div>
    ${startedDate}
    ${clusterBadge}
    ${body}
    ${chips.length ? `<div class="tags">${chips.join("")}</div>` : ""}
    ${aiRow}
  </div>`;
}
