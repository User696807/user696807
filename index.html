function chip(name, cls, category){
  const sel = filter && filter.category===category && filter.value===name;
  const symbol = category==='themes'?'#':(category==='characters'?'@':LOC_SYMBOL);
  return `<button class="tag-chip ${cls} ${sel?'selected':''}" data-name="${escapeAttr(name)}" data-cat="${category}">${symbol}${escapeHtml(name)}</button>`;
}

/* =========================================================================
   KEYWORD-IN-CONTEXT EXCERPT (used whenever a tag filter is active)
   ========================================================================= */
function buildExcerpt(e, flt){
  const symbol = flt.category==='themes' ? '#' : (flt.category==='characters' ? '@' : LOC_SYMBOL);
  const escVal = escapeRegex(flt.value);
  const tagRe = new RegExp(escapeRegex(symbol) + "(?:\\[" + escVal + "\\]|" + escVal + "(?![\\p{L}\\p{N}_]))", "iu");
  const fields = FIELDS_BY_TYPE[e.type] || [];
  for(const f of fields){
    if(f.type === 'weather') continue;
    const text = e[f.key];
    if(!text || !tagRe.test(text)) continue;
    const sentences = String(text).split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
    let idx = sentences.findIndex(s => tagRe.test(s));
    if(idx === -1) idx = 0;
    const start = Math.max(0, idx-2);
    const end = Math.min(sentences.length, idx+3);
    return {
      label: f.label,
      text: sentences.slice(start, end).join(' ') || text,
      truncatedStart: start > 0,
      truncatedEnd: end < sentences.length
    };
  }
  return null;
}
function excerptCardHtml(e, flt){
  const exc = buildExcerpt(e, flt);
  const chips = [];
  (e.characters||[]).forEach(t => chips.push(chip(t,'char','characters')));
  (e.locations||[]).forEach(t => chips.push(chip(t,'loc','locations')));
  (e.themes||[]).forEach(t => chips.push(chip(t,'theme','themes')));
  const meta = TYPE_META[e.type];
  const clusterBadge = clusterBadgeHtml(e);
  const body = exc
    ? `<div class="field-label">${exc.label}</div><p class="entry-text">${exc.truncatedStart?'… ':''}${highlightHtml(exc.text)}${exc.truncatedEnd?' …':''}</p>`
    : `<p class="entry-text" style="color:var(--muted-soft); font-style:italic;">Tagged, but no matching passage found.</p>`;
  return `<div class="entry excerpt-card" id="entry-${e.id}" data-goto="${e.id}">
    <div class="entry-top">
      <span class="entry-title" style="color:${meta.color}; font-weight:${isBold(e)?'700':'400'};">${meta.icon} ${escapeHtml(entryTitle(e))}${significanceBadge(e)}</span>
      <span class="excerpt-hint">read full entry →</span>
    </div>
    ${clusterBadge}
    ${body}
    ${chips.length ? `<div class="tags">${chips.join("")}</div>` : ""}
  </div>`;
}

/* =========================================================================
   WIRE ENTRY CARDS (edit / delete / done / tag filter / navigate / AI copy)
   ========================================================================= */
function wireEntryCards(){
  document.querySelectorAll('.tag-chip[data-name]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const name = el.getAttribute('data-name'), cat = el.getAttribute('data-cat');
      filter = (filter && filter.category===cat && filter.value===name) ? null : {category:cat, value:name};
      editingEntryId = null;
      renderContent();
    });
  });
  document.querySelectorAll('.excerpt-card[data-goto]').forEach(el => {
    el.addEventListener('click', () => {
      filter = null;
      scrollToEntryId = el.getAttribute('data-goto');
      renderContent();
    });
  });
  document.querySelectorAll('[data-toggle-done]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const en = entries.find(x => x.id === el.getAttribute('data-toggle-done'));
      if(en){ en.done = !en.done; save(); renderContent(); }
    });
  });
  document.querySelectorAll('[data-expand-note]').forEach(el => {
    el.addEventListener('click', () => {
      expandedNoteIds.add(el.getAttribute('data-expand-note'));
      renderContent();
    });
  });
  document.querySelectorAll('[data-collapse-note]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      expandedNoteIds.delete(el.getAttribute('data-collapse-note'));
      renderContent();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); editingEntryId = el.getAttribute('data-edit'); confirmDeleteId = null; renderContent(); });
  });
  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); confirmDeleteId = el.getAttribute('data-del'); renderContent(); });
  });
  document.querySelectorAll('[data-yes]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const idToDelete = el.getAttribute('data-yes');
      const deleted = entries.find(e => e.id === idToDelete);
      entries = entries.filter(e => e.id !== idToDelete);
      if(deleted && deleted.type === 'dreamgroup'){
        entries.forEach(e => {
          if(e.type === 'dream' && e.groupId === idToDelete){ e.groupId = null; e.groupOrder = 0; }
        });
      }
      renumberAll(); save(); confirmDeleteId = null; renderContent();
    });
  });
  document.querySelectorAll('[data-no]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); confirmDeleteId = null; renderContent(); });
  });
  document.querySelectorAll('[data-copy-prompt]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const en = entries.find(x => x.id === el.getAttribute('data-copy-prompt'));
      if(!en) return;
      const ok = await copyToClipboard(buildAiPrompt(en));
      const old = el.textContent;
      el.textContent = ok ? '✓ Copied' : 'Copy failed';
      setTimeout(() => { el.textContent = old; }, 1500);
    });
  });
  document.querySelectorAll('[data-open-ai]').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); window.open('https://claude.ai/new', '_blank'); });
  });
  document.querySelectorAll('[data-goto-cluster]').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      goToCluster(el.getAttribute('data-goto-cluster'), el.getAttribute('data-from-dream'));
    });
  });

  if(editingEntryId){
    const e = entries.find(en => en.id === editingEntryId);
    if(e){
      const meta = TYPE_META[e.type];
      editRatingValue = e.rating || 0;
      editSignificance = e.significance || 0;
      editSignificant = !!e.significant;
      editWeather = e.weather || '';
      editMoodValence = e.moodValence || '';
      const scope = document.getElementById('entry-'+e.id);

      if(meta.hasRating){
        function updateEditStars(){
          scope.querySelectorAll('.rating-input .star-slot').forEach(slot => {
            const idx = parseInt(slot.getAttribute('data-index'));
            let fill = 0;
            if(editRatingValue >= idx) fill = 100;
            else if(editRatingValue >= idx-0.5) fill = 50;
            slot.querySelector('.star-fg').style.width = fill+'%';
          });
          const lbl = document.getElementById('editRatingLabel');
          if(lbl) lbl.textContent = editRatingValue > 0 ? (editRatingValue+' / 5') : 'No rating';
        }
        scope.querySelectorAll('.rating-input .star-slot').forEach(slot => {
          slot.addEventListener('click', (ev) => {
            const rect = slot.getBoundingClientRect();
            const half = (ev.clientX - rect.left) < rect.width/2;
            const idx = parseInt(slot.getAttribute('data-index'));
            editRatingValue = half ? idx-0.5 : idx;
            updateEditStars();
          });
        });
        const erc = document.getElementById('editRatingClear');
        if(erc) erc.addEventListener('click', () => { editRatingValue = 0; updateEditStars(); });
      }
      if(meta.hasSignificanceLevels){
        scope.querySelectorAll('.sig-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            editSignificance = parseInt(btn.getAttribute('data-val'));
            scope.querySelectorAll('.sig-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });
      }
      if(meta.hasSignificanceFlag){
        const dotBtn = document.getElementById('editSigDotToggle');
        if(dotBtn) dotBtn.addEventListener('click', () => {
          editSignificant = !editSignificant;
          dotBtn.classList.toggle('active', editSignificant);
        });
      }
      if(e.type === 'dream'){
        scope.querySelectorAll('.weather-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.getAttribute('data-val');
            editWeather = (editWeather === val) ? '' : val;
            scope.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
            if(editWeather) btn.classList.add('active');
          });
        });
        scope.querySelectorAll('.mood-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            editMoodValence = btn.getAttribute('data-val');
            scope.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        });
        wireClusterPicker(true);
      }

      const cancelBtn = document.querySelector('[data-cancel-edit="'+e.id+'"]');
      if(cancelBtn) cancelBtn.addEventListener('click', () => { editingEntryId = null; renderContent(); });

      const saveBtn2 = document.querySelector('[data-save-edit="'+e.id+'"]');
      if(saveBtn2) saveBtn2.addEventListener('click', () => {
        const newDate = document.getElementById('editDateInput').value;
        if(newDate) e.date = newDate;
        (FIELDS_BY_TYPE[e.type]||[]).forEach(f => {
          if(f.type === 'weather') return;
          const el = document.getElementById('edit_'+f.key);
          if(el) e[f.key] = el.value.trim();
        });
        if(meta.hasRating) e.rating = editRatingValue;
        if(meta.hasSignificanceLevels) e.significance = editSignificance;
        if(meta.hasSignificanceFlag) e.significant = editSignificant;
        if(meta.hasDone){ const dc = document.getElementById('editDoneCheck'); if(dc) e.done = dc.checked; }
        if(e.type === 'dream'){
          e.weather = editWeather;
          e.moodValence = editMoodValence;
          const cluster = resolveClusterSelection(true, e.date);
          e.groupId = cluster.groupId;
          e.groupOrder = cluster.groupOrder;
        }
        retagEntry(e);
        renumberAll();
        save();
        editingEntryId = null;
        renderContent();
      });
    }
  }
}

/* =========================================================================
   SIDEBAR MONTH JUMP (expandable accordion)
   ========================================================================= */
function renderMonthJump(){
  if(view === 'notes'){ renderNotesSidebar(); return; }
  const wrap = document.getElementById('monthJumpWrap');
  const listViews = {feed:null, dreams:"dream", sessions:"session", reallife:"reallife"};
  if(!(view in listViews) || entries.length === 0){ wrap.style.display = 'none'; return; }
  const typeFilter = listViews[view];
  const base = typeFilter ? entries.filter(e=>e.type===typeFilter) : entries.filter(e => e.type !== 'dreamgroup' && e.type !== 'notes');
  if(base.length === 0){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  wrap.innerHTML = `<div class="sidebar-label">Jump to</div><div id="monthJump">${monthListHtml(base)}</div>`;
  wireMonthList();
}
// Shared "grouped by month, expandable, thread-connected" list markup, used
// both by the standard sidebar jump list and Notes' Chronological View.
function monthListHtml(items){
  const groups = groupByMonth(orderedList(items));
  return groups.map(g => `
    <div class="month-group">
      <button class="month-link" type="button" data-key="${g.key}">
        <span>${expandedMonth===g.key ? '▾' : '▸'} ${g.label}</span><span class="n">${g.items.length}</span>
      </button>
      ${expandedMonth===g.key ? `<div class="month-sublist">${decorateClusterAdjacency(g.items).map(({entry:e, segUp, segDown}) => `
        <div class="thread-row">
          <span class="thread-gutter">${segUp?'<span class="seg-up"></span>':''}${segDown?'<span class="seg-down"></span>':''}${(segUp||segDown)?'<span class="seg-h"></span>':''}</span>
          <button class="entry-link" type="button" data-goto="${e.id}" style="font-weight:${isBold(e)?'700':'400'};" title="${escapeAttr(entryTitle(e))}">${escapeHtml(entryTitle(e))}${significanceBadge(e)}</button>
        </div>
      `).join('')}</div>` : ''}
    </div>
  `).join('');
}
function wireMonthList(){
  document.querySelectorAll('.month-link[data-key]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-key');
      expandedMonth = (expandedMonth===key) ? null : key;
      renderMonthJump();
    });
  });
  document.querySelectorAll('.entry-link').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-goto');
      const target = entries.find(en => en.id === id);
      closeSidebar();
      if(target && target.type === 'dream' && target.groupId){
        goToCluster(target.groupId, target.id);
        return;
      }
      const domEl = document.getElementById('entry-'+id);
      if(domEl){
        domEl.scrollIntoView({behavior:'smooth', block:'center'});
        domEl.style.transition = 'box-shadow 0.3s ease';
        domEl.style.boxShadow = '0 0 0 2px var(--amber)';
        setTimeout(() => { domEl.style.boxShadow = ''; }, 1600);
      } else {
        scrollToEntryId = id;
        renderContent();
      }
    });
  });
}
// Notes get their own sidebar layout: a "Categories" group (grouped by the
// free-text Category field, with an "Uncategorized" bucket) and the usual
// date-based list rolled up under "Chronological View" — both collapsible
// and independently persistent, same as the other sidebar groups.
function noteCategoriesMap(){
  const notes = entries.filter(e => e.type === 'notes');
  const map = {};
  notes.forEach(n => {
    const cat = (n.category && n.category.trim()) ? n.category.trim() : 'Uncategorized';
    if(!map[cat]) map[cat] = [];
    map[cat].push(n);
  });
  return map;
}
function renderNotesSidebar(){
  const wrap = document.getElementById('monthJumpWrap');
  const notes = entries.filter(e => e.type === 'notes');
  if(notes.length === 0){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';

  const catMap = noteCategoriesMap();
  const catNames = Object.keys(catMap).sort((a,b) => {
    if(a === 'Uncategorized') return 1;
    if(b === 'Uncategorized') return -1;
    return a.localeCompare(b, 'tr');
  });

  wrap.innerHTML = `
    <div class="sidebar-label">Analysis</div>
    <button class="sidebar-group-header" type="button" data-notegroup="cat">${noteCategoriesOpen?'▾':'▸'} Categories</button>
    <div class="sidebar-group-content ${noteCategoriesOpen?'':'collapsed'}">
      ${catNames.map(cat => {
        const sel = noteCategoryFilter === cat;
        return `<button class="month-link" type="button" data-notecat="${escapeAttr(cat)}" style="${sel?'color:var(--violet);':''}">
          <span>${escapeHtml(cat)}</span><span class="n">${catMap[cat].length}</span>
        </button>`;
      }).join('')}
    </div>
    <button class="sidebar-group-header" type="button" data-notegroup="chrono">${noteChronoOpen?'▾':'▸'} Chronological View</button>
    <div class="sidebar-group-content ${noteChronoOpen?'':'collapsed'}">
      <div id="monthJump">${monthListHtml(notes)}</div>
    </div>
  `;

  document.querySelectorAll('[data-notegroup]').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.getAttribute('data-notegroup');
      if(g === 'cat') noteCategoriesOpen = !noteCategoriesOpen;
      if(g === 'chrono') noteChronoOpen = !noteChronoOpen;
      renderNotesSidebar();
    });
  });
  document.querySelectorAll('[data-notecat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.getAttribute('data-notecat');
      noteCategoryFilter = (noteCategoryFilter === cat) ? null : cat;
      closeSidebar();
      renderContent();
    });
  });
  wireMonthList();
}
// For a list of dream entries in display order, works out whether each one
// should show a connecting line up to and/or down to a same-cluster sibling
// immediately adjacent to it in that order.
function decorateClusterAdjacency(items){
  return items.map((e, i) => {
    const prev = items[i-1];
    const next = items[i+1];
    const segUp = !!(e.groupId && prev && prev.type === 'dream' && prev.groupId === e.groupId);
    const segDown = !!(e.groupId && next && next.type === 'dream' && next.groupId === e.groupId);
    return {entry: e, segUp, segDown};
  });
}

/* =========================================================================
   ROUTER
   ========================================================================= */
let lastRenderedView = null;
function renderContent(){
  const mainEl = document.getElementById('main');
  const samePage = (view === lastRenderedView);
  const savedScrollTop = (mainEl && samePage) ? mainEl.scrollTop : 0;

  if(view === 'import-confirm'){
    renderImportConfirm();
    document.getElementById('monthJumpWrap').style.display = 'none';
  } else if(view === 'search'){
    renderSearchView();
    document.getElementById('monthJumpWrap').style.display = 'none';
  } else if(view === 'literature'){
    renderLiteraturePage();
    document.getElementById('monthJumpWrap').style.display = 'none';
  } else if(view === 'sessionstats'){
    renderSessionStats();
    document.getElementById('monthJumpWrap').style.display = 'none';
  } else if(view === 'dreamstats'){
    renderDreamStats();
    document.getElementById('monthJumpWrap').style.display = 'none';
  } else if(view === 'feed' || view === 'dreams' || view === 'sessions' || view === 'reallife' || view === 'notes'){
    renderListView(view);
    renderMonthJump();
  } else {
    const catEntries = entries.filter(e => catTypeFilter.has(e.type));
    const stats = computeStats(catEntries);
    if(view === 'characters'){
      renderPieSection('Characters', stats.characters, COLORS.rose, 'characters', 'No characters tagged yet. Tag someone with @Name in any log.', stats.charLast, catEntries.length);
    } else if(view === 'locations'){
      renderPieSection('Locations', stats.locations, COLORS.teal, 'locations', `No locations tagged yet. Tag a place with ${LOC_SYMBOL}Somewhere.`, stats.locLast, catEntries.length);
    } else if(view === 'themes'){
      renderPieSection('Themes', stats.themes, COLORS.amber, 'themes', 'No themes tagged yet. Tag a symbol or pattern with #concept.', stats.themeLast, catEntries.length);
    }
    renderMonthJump();
  }

  if(mainEl){
    if(samePage) mainEl.scrollTop = savedScrollTop;
    else mainEl.scrollTop = 0;
  }
  lastRenderedView = view;
}

init();
</script>
